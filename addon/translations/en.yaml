configuration:
  shopping_webhook_id:
    name: Shopping list webhook ID (legacy)
    description: >-
      Webhook ID for adding ingredients to a Home Assistant shopping list.
      Find it in Settings → Automations → your automation → webhook trigger.
      Used only as a fallback when OurGroceries is not configured below.
  ourgroceries_email:
    name: OurGroceries email
    description: >-
      Email address for your OurGroceries account. When email, password and
      list ID are all set, shopping items are sent straight to your shared
      OurGroceries list (with amounts as item notes) instead of the webhook.
  ourgroceries_password:
    name: OurGroceries password
    description: Password for your OurGroceries account.
  ourgroceries_list_id:
    name: OurGroceries list ID
    description: >-
      The ID of the OurGroceries list to add items to. Open the list at
      ourgroceries.com and copy the ID from the URL
      (ourgroceries.com/your-lists/list/<LIST_ID>).
